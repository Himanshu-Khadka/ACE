[project]
name = "ace"
version = "0.1.0"
description = "Assignment & Coursework Engine: sync Canvas courses locally and search them with AI."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "beautifulsoup4>=4.12",
  "pypdf>=4.0",
  "python-pptx>=0.6.23",
  "python-docx>=1.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ace = "ace.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
